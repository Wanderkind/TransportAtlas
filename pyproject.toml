[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-atlas"
version = "0.1.0"
description = "Private GTFS network atlas and timetable analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.3,<2", "fastapi>=0.110,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
