name: UI smoke (synthetic GTFS)
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/smoke_ui.py'
      - '.github/workflows/ui-smoke.yml'
      - 'pyproject.toml'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python and browser test dependencies
        run: python -m pip install -e '.[dev]' selenium
      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Import fictional demonstration feed
        run: python -m transport_atlas import --file backend/tests/fixtures/synthetic_sardinia.zip --source demo --publisher 'Synthetic Demo'
      - name: Launch local servers
        run: |
          nohup python -m transport_atlas serve > backend.log 2>&1 &
          (cd frontend && nohup npm run dev > ../frontend.log 2>&1) &
      - name: Smoke test with Chrome
        run: python scripts/smoke_ui.py
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: transport-atlas-ui-smoke-failure
          path: |
            ui-smoke-failure.png
            backend.log
            frontend.log
          if-no-files-found: ignore
