name: Official GTFS compatibility probe
on:
  pull_request:
    paths:
      - "backend/**"
      - "configs/sardinia_sources.json"
      - "scripts/check_sardinia_live.py"
      - ".github/workflows/live-gtfs-compatibility.yml"
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Attempt official feed download and real GTFS import
        run: |
          mkdir -p data/live-verification
          python scripts/check_sardinia_live.py
      - name: Upload report (never upload raw feed or database)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sardinia-live-report
          path: |
            data/live-verification/report.json
            data/live-verification/report.md
          if-no-files-found: warn
      - name: Update compatibility report on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const filename = 'data/live-verification/report.md';
            if (!fs.existsSync(filename)) return;
            const marker = '<!-- transport-atlas-live-gtfs-probe -->';
            const body = marker + '\n' + fs.readFileSync(filename,'utf8').slice(0,40000);
            const {owner,repo} = context.repo;
            const issue_number = context.issue.number;
            const {data:comments} = await github.rest.issues.listComments({owner,repo,issue_number,per_page:100});
            const previous = comments.find(c=>c.user?.type==='Bot' && c.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({owner,repo,comment_id:previous.id,body});
            else await github.rest.issues.createComment({owner,repo,issue_number,body});
